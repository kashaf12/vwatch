[project]
name = "vwatch"
version = "0.2.1"
description = "Agent toolkit that watches video like a person (question-first plan, prediction-error attention, dense seek/crop/listen on surprising moments), plus an eval harness against uniform frame sampling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kashaf12" }]
requires-python = ">=3.11"
keywords = ["video", "mcp", "mcp-server", "claude-code-plugin", "video-understanding", "llm", "agent", "claude", "evaluation", "benchmark", "multimodal", "ffmpeg", "whisper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.6",
  "faster-whisper>=1.0",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/kashaf12/vwatch"
Repository = "https://github.com/kashaf12/vwatch"
Issues = "https://github.com/kashaf12/vwatch/issues"
Changelog = "https://github.com/kashaf12/vwatch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["anthropic>=0.70"]
# MCP server (`vwatch-mcp` / `vw mcp`); static-ffmpeg fetches ffmpeg+ffprobe on first use when none is on PATH
mcp = ["mcp>=2.3,<3", "static-ffmpeg>=3.0,<4"]

[project.scripts]
vw = "vwatch.cli:main"
vwatch-mcp = "vwatch.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mcp>=2.3,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# Rebuild a local install (e.g. VWATCH_SPEC='vwatch[mcp] @ file:///path') when the code changes,
# not only when pyproject.toml does; otherwise uvx keeps serving a stale cached build.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.hatch.build.targets.wheel]
packages = ["src/vwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs ffmpeg/whisper, slower"]

[tool.coverage.run]
source = ["vwatch"]
omit = ["src/vwatch/cli.py", "src/vwatch/llm/anthropic_api.py"]
